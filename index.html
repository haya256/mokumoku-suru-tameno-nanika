<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>もくもく会</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: row;
      height: 100dvh;
    }

    #roomView {
      position: relative;
      flex-shrink: 0;
      align-self: center;
      width: min(50vw, 100dvh);
      aspect-ratio: 1 / 1;
    }

    /* ワールドマップ: 中央(インデックス4)が自分のルーム、周囲8マスがつながった相手ルーム。
       focus-modeでは選ばれた1マスだけをグリッド全体に広げてフルサイズ表示する */
    #worldMap {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 3px;
      /* 未接続のマスとほぼ同色にして、霧の領域がひと続きの土地に見えるようにする */
      background: #9fa099;
    }

    #worldMap.focus-mode { gap: 0; background: none; }
    #worldMap.focus-mode .tile { display: none; }

    #worldMap.focus-mode .tile.focused {
      display: block;
      grid-column: 1 / 4;
      grid-row: 1 / 4;
    }

    .tile {
      position: relative;
      overflow: hidden;
      background: #eee;
      cursor: pointer;
    }

    .tile.focused, .tile.empty { cursor: default; }
    .tile.empty > img, .tile.empty > .room-overlay,
    .tile.empty > .tile-label, .tile.empty > .tile-status { display: none; }

    /* 未接続のマスは「まだ何も無い土地に霧がかかっている」見た目にする。
       本物の部屋画像と張り合わないよう、彩度もコントラストも低めに抑える */
    .tile.empty {
      background-color: #a5a69f;
      background-image:
        radial-gradient(ellipse 70% 45% at 28% 32%, rgba(255,255,255,0.32), rgba(255,255,255,0) 70%),
        radial-gradient(ellipse 60% 40% at 74% 72%, rgba(255,255,255,0.24), rgba(255,255,255,0) 70%),
        repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0 7px, rgba(0,0,0,0) 7px 14px);
    }

    .tile.empty::after {
      content: "?";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      /* 霧の濃淡に関係なく一定の沈み具合になるよう、色ではなくわずかな黒を重ねる。
         ぼかすと輪郭が広がって薄く見えるぶん、不透明度は少し上げてある */
      color: rgba(0, 0, 0, 0.13);
      filter: blur(1px);
    }

    .tile > img {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    /* 中継画像がまだ届いていない間(404)に壊れた画像アイコンを出さない */
    .tile > img.missing { visibility: hidden; }
    .tile.offline > img { filter: grayscale(1); opacity: 0.35; }

    /* 上端は「← マップへ」と管理者ボタンが占めるので、ルーム名は下端に置く
       (キャラは下端から14%の位置に立つので重ならない) */
    .tile-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .tile.focused .tile-label { font-size: 0.85rem; }
    #worldMap:not(.focus-mode) .tile.self .tile-label { background: rgba(40, 90, 60, 0.7); }
    /* 自分のルームを拡大しているときは従来の全画面表示と同じ見た目にする */
    #worldMap.focus-mode .tile.self .tile-label { display: none; }

    .tile-status {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.55);
      color: #666;
      font-size: 0.7rem;
      pointer-events: none;
    }

    /* displayを指定した時点でブラウザ既定の [hidden]{display:none} を上書きしてしまうので、
       hidden属性を効かせるには自分で打ち消す必要がある */
    .tile-status[hidden] { display: none; }

    #backToMapBtn, #adminBar button {
      background: rgba(255,255,255,0.85);
      color: #333;
      border: 1px solid #999;
      border-radius: 4px;
      padding: 2px 10px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    #backToMapBtn:hover, #adminBar button:hover { background: #fff; }

    #backToMapBtn {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 4;
    }

    #adminBar {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 4;
      display: flex;
      gap: 6px;
    }

    /* 部屋画像の差し替えは自分のルームを見ているときだけ意味があるので、そのときだけ出す */
    #roomImageBtn { display: none; }
    #roomView.showing-self #roomImageBtn { display: block; }

    #roomImagePanel, #worldPanel {
      position: absolute;
      top: 36px;
      right: 8px;
      z-index: 5;
      background: #fff;
      border: 1px solid #999;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-width: calc(100% - 16px);
    }

    #roomImagePanel img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 4px;
      image-rendering: pixelated;
    }

    #roomImagePanel img.selected { border-color: #3a3; }
    #roomImagePanel img:hover { opacity: 0.85; }

    #worldPanel {
      flex-direction: column;
      flex-wrap: nowrap;
      width: min(320px, calc(100% - 16px));
      font-size: 0.8rem;
    }

    #worldPanel .peer-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #worldPanel .peer-info {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #worldPanel .peer-empty { color: #aaa; }

    #worldPanel .peer-del {
      flex-shrink: 0;
      background: #fff;
      color: #c33;
      border: 1px solid #c33;
      border-radius: 4px;
      padding: 1px 8px;
      font-size: 0.75rem;
    }

    #worldPanel .peer-del:hover { background: #fee; }

    #worldPanel .peer-add {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px dashed #ccc;
      padding-top: 8px;
    }

    #worldPanel .peer-add input { font-size: 0.8rem; }
    #worldPanel .peer-add button { padding: 5px 10px; font-size: 0.8rem; }

    .room-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
    }

    .cell {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      /* キャラ下端を部屋の高さの14%に保つ */
      padding-bottom: 14%;
    }

    /* 縮小表示のマスでは名前バッジが部屋に対して大きすぎるので、拡大したマスだけで出す
       (バッジは絶対配置なので、出すときはその高さぶんキャラを押し上げる) */
    .cell .badge { display: none; }
    .tile.focused .cell { padding-bottom: calc(14% + 24px); }
    .tile.focused .cell .badge { display: block; }

    /* キャラクターのスプライトシート: 9列×6行。1キャラ=3列×2行(6ポーズ)のブロックが部屋と同じ3×3配置 */
    .cell .chara {
      width: 33%;
      aspect-ratio: 2 / 3;
      background-image: url("/chara-image.png");
      background-size: 900% 600%;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      animation: bob 2s steps(1, end) infinite;
    }

    /* アップロードされたカスタム画像はスプライトでなく1枚絵として表示 */
    .cell .chara.custom {
      background-size: contain;
      background-position: center;
      image-rendering: auto;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .cell .badge {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      border-radius: 999px;
      padding: 3px 12px;
      font-size: 0.85rem;
      font-weight: bold;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100dvh;
    }

    @media (max-width: 800px) {
      body {
        flex-direction: column;
        height: auto;
        min-height: 100dvh;
      }

      #roomView {
        width: 100%;
        align-self: auto;
      }

      #main {
        height: auto;
        flex: 1;
      }
    }

    header {
      background: #333;
      color: #fff;
      padding: 12px 16px;
      font-size: 1.1rem;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #discordStatus {
      font-size: 0.75rem;
      font-weight: normal;
      padding: 3px 10px;
      border-radius: 999px;
      background: #555;
      color: #ccc;
    }

    #discordStatus.on {
      background: #2e7d32;
      color: #fff;
    }

    #discordStatus.error {
      background: #b71c1c;
      color: #fff;
    }

    #board {
      background: #fff;
      border-bottom: 2px dashed #bbb;
      padding: 10px 16px;
      max-height: 30dvh;
      overflow-y: auto;
    }

    #board h2 {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 6px;
    }

    #board .empty {
      font-size: 0.85rem;
      color: #aaa;
    }

    .entry {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 4px 0;
      font-size: 0.9rem;
    }

    .entry .room {
      background: #333;
      color: #fff;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .entry .who {
      font-weight: bold;
      flex-shrink: 0;
    }

    .entry .when {
      color: #888;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .entry .what {
      word-break: break-word;
      flex: 1;
    }

    .entry .kick {
      flex-shrink: 0;
      background: #fff;
      color: #c33;
      border: 1px solid #c33;
      border-radius: 4px;
      padding: 1px 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .entry .kick:hover {
      background: #fee;
    }

    /* つながった相手ルーム由来の行・発言は、自分のルームのものと色で区別する */
    .entry.remote .room { background: #4a6b8a; }

    .msg.remote { border-left: 3px solid #4a6b8a; }
    .msg.system.remote { border-left: none; }

    .msg .from {
      display: inline-block;
      background: #4a6b8a;
      color: #fff;
      border-radius: 3px;
      padding: 0 5px;
      margin-right: 5px;
      font-size: 0.7rem;
      font-weight: normal;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      background: #fff;
      border-radius: 8px;
      padding: 8px 12px;
      max-width: 480px;
      flex-shrink: 0;
    }

    .msg .meta {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 2px;
    }

    .msg .meta span {
      font-weight: bold;
      color: #333;
    }

    .msg .text {
      font-size: 0.95rem;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .msg .text a { color: #2a5db0; word-break: break-all; }
    .msg .text a:hover { text-decoration: none; }

    .yt-embed {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 16 / 9;
      margin-top: 6px;
    }
    .yt-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 6px;
    }

    .msg.system {
      background: none;
      border-radius: 0;
      align-self: center;
      /* 中央寄せなので、はみ出すと左右とも切れてしまう。幅を抑えて末尾だけ「…」にする */
      max-width: 100%;
      padding: 2px 12px;
      font-size: 0.8rem;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .msg.system .stamp {
      opacity: 0.7;
      margin-right: 6px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 16px;
      background: #fff;
      border-top: 1px solid #ddd;
    }

    form .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 8px;
      align-items: center;
    }

    .row label {
      font-size: 0.8rem;
      color: #888;
      flex-shrink: 0;
    }

    .field {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #joinRow, #statusRow {
      flex-wrap: nowrap;
      align-items: stretch;
    }

    .lines {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .row-line {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 8px;
      align-items: center;
    }

    .tall-btn {
      flex-shrink: 0;
      align-self: stretch;
      min-width: 90px;
      font-size: 1.05rem;
    }

    input[type="time"] {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 7px 6px;
      font-size: 0.9rem;
      outline: none;
    }

    input[type="text"], textarea {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: #555;
    }

    input[type="file"] {
      font-size: 0.8rem;
    }

    textarea {
      font-family: inherit;
      line-height: 1.4;
      resize: none;
      max-height: 120px;
      overflow-y: auto;
    }

    #name { width: 100px; flex-shrink: 0; }
    #text { flex: 1; }
    #task { flex: 1; min-width: 0; }

    button {
      background: #333;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    button:hover { background: #555; }

    #joinBtn {
      background: #2a7;
      flex-shrink: 0;
    }

    #joinBtn:hover { background: #3b8; }

    #editBtn { flex-shrink: 0; }

    #cancelEditBtn {
      background: #fff;
      color: #888;
      border: 1px solid #ccc;
      flex-shrink: 0;
    }

    #cancelEditBtn:hover { background: #eee; }

    #recordLabel {
      font-size: 0.85rem;
      color: #555;
      flex-shrink: 0;
    }

    #recordText {
      flex: 1;
      min-width: 0;
      background: #f8f8f8;
      font-size: 0.85rem;
    }

    #copyBtn { flex-shrink: 0; }

    #closeRecordBtn {
      background: #fff;
      color: #888;
      border: 1px solid #ccc;
      flex-shrink: 0;
    }

    #closeRecordBtn:hover { background: #eee; }

    #leaveBtn {
      background: #fff;
      color: #c33;
      border: 1px solid #c33;
      flex-shrink: 0;
    }

    #leaveBtn:hover { background: #fee; }

    #myStatus {
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div id="roomView">
    <div id="worldMap"></div>
    <button type="button" id="backToMapBtn" hidden>← マップへ</button>
  </div>
  <div id="main">
  <header>もくもく会 <span id="discordStatus"></span></header>
  <div id="board">
    <h2>もくもくフレンズ</h2>
    <div id="entries"><div class="empty">まだ誰ももくもくしていません</div></div>
  </div>
  <div id="messages"></div>
  <form id="form">
    <div class="row" id="joinRow">
      <div class="lines">
        <div class="row-line">
          <input id="name" type="text" placeholder="名前">
          <span class="field"><label for="chara">キャラ画像(任意/未指定なら自動割当)</label><input id="chara" type="file" accept="image/*"></span>
        </div>
        <div class="row-line">
          <input id="task" type="text" placeholder="もくもくする内容(ボードに載ります)">
          <span class="field"><label for="start">開始</label><input id="start" type="time"></span>
          <span class="field"><label for="end">終了予定</label><input id="end" type="time"></span>
        </div>
      </div>
      <button type="button" id="joinBtn" class="tall-btn">入室</button>
      <button type="button" id="cancelEditBtn" class="tall-btn" style="display: none;">キャンセル</button>
    </div>
    <div class="row" id="statusRow" style="display: none;">
      <div class="lines">
        <div class="row-line">
          <span id="myStatus"></span>
          <button type="button" id="editBtn">編集</button>
        </div>
        <div class="row-line">
          <textarea id="text" placeholder="コメント (Shift+Enterで改行)" rows="1"></textarea>
          <button type="submit">送信</button>
        </div>
      </div>
      <button type="button" id="leaveBtn" class="tall-btn">退室</button>
    </div>
    <div class="row" id="recordRow" style="display: none;">
      <span id="recordLabel">📋 今日の記録</span>
      <input id="recordText" type="text" readonly>
      <button type="button" id="copyBtn">コピー</button>
      <button type="button" id="closeRecordBtn">✕</button>
    </div>
  </form>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const entriesEl = document.getElementById("entries");
    const form = document.getElementById("form");
    const nameEl = document.getElementById("name");
    const textEl = document.getElementById("text");
    const taskEl = document.getElementById("task");
    const startEl = document.getElementById("start");
    const endEl = document.getElementById("end");
    const charaEl = document.getElementById("chara");
    const joinRow = document.getElementById("joinRow");
    const statusRow = document.getElementById("statusRow");
    const myStatusEl = document.getElementById("myStatus");
    const joinBtn = document.getElementById("joinBtn");
    const editBtn = document.getElementById("editBtn");
    const leaveBtn = document.getElementById("leaveBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const recordRow = document.getElementById("recordRow");
    const recordText = document.getElementById("recordText");
    const copyBtn = document.getElementById("copyBtn");
    const closeRecordBtn = document.getElementById("closeRecordBtn");
    const discordStatusEl = document.getElementById("discordStatus");
    const roomViewEl = document.getElementById("roomView");
    const worldMapEl = document.getElementById("worldMap");
    const backToMapBtn = document.getElementById("backToMapBtn");

    let editing = false;
    let lastEntries = [];
    // つながった相手ルームの最新状態(/world の戻り値)。0件なら従来どおり自分のルームの全画面表示
    let peers = [];
    // 拡大表示中のマス。null=ワールドマップ表示 / "self"=自分のルーム / それ以外はピアのid
    let focusedKey = null;
    let localMessages = [];
    let selfRoomImageSrc = "/room-image.webp";
    // 合言葉欄に管理者合言葉を入れた場合にtrueになる(サーバー側が都度判定。ここはボタン表示のためだけのキャッシュ)
    let isAdmin = false;
    let prevIsAdmin = false; // isAdminの変化点でだけボタンを付け外しする(毎ポーリングで作り直さない)
    // 部屋画像のバージョン。nullは「まだ基準値を持っていない」状態(初回pollで基準値として記録するだけで再取得はしない)
    let roomImageVersion = null;
    let pendingImageVersion = null; // ジッター待ち中のバージョン(同じ変化に対して二重にsetTimeoutしない)
    nameEl.value = localStorage.getItem("mokumoku-name") || "";
    // 入室を待たず、名前欄の変更時点で即保存する
    nameEl.addEventListener("input", () => {
      localStorage.setItem("mokumoku-name", nameEl.value.trim());
    });

    // 本人識別用ID(ブラウザごとに固定)。名前は表示用なので変更しても別人にならない
    // ※crypto.randomUUIDはLAN経由のhttpアクセス(非セキュアコンテキスト)では使えないため自前生成
    let clientId = localStorage.getItem("mokumoku-id");
    if (!clientId) {
      clientId = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      localStorage.setItem("mokumoku-id", clientId);
    }
    const ROOM_COUNT = 9;
    // 3×3マップの中央は自分のルーム固定。ピアのslot(0〜7)は周囲8マスに対応する
    const SELF_INDEX = 4;
    const SLOT_TO_INDEX = [0, 1, 2, 3, 5, 6, 7, 8];

    // マスは9つ作ったきり使い回す。毎pollで作り直すとキャラのCSSアニメーションがリセットされるため
    const tiles = [];
    for (let i = 0; i < 9; i++) {
      const el = document.createElement("div");
      el.className = "tile empty";
      const img = document.createElement("img");
      img.alt = "";
      img.addEventListener("error", () => img.classList.add("missing"));
      img.addEventListener("load", () => img.classList.remove("missing"));
      const overlay = document.createElement("div");
      overlay.className = "room-overlay";
      for (let r = 0; r < ROOM_COUNT; r++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        overlay.appendChild(cell);
      }
      const label = document.createElement("span");
      label.className = "tile-label";
      const status = document.createElement("span");
      status.className = "tile-status";
      status.hidden = true;
      el.append(img, overlay, label, status);
      worldMapEl.appendChild(el);
      tiles.push({ el, img, overlay, label, status, cells: [...overlay.children], key: null, lastState: "" });
    }

    let lastMsgSig = "";

    function render(msgs) {
      // マージ後は件数だけでは変化を判定できない(ピアの取得遅れで途中に挿入されうる)ため、
      // 件数と末尾のタイムスタンプを繋げたシグネチャで比べる
      const sig = `${msgs.length}|${msgs.length ? msgs[msgs.length - 1].ts : 0}`;
      if (sig === lastMsgSig) return;
      lastMsgSig = sig;
      messagesEl.innerHTML = "";
      msgs.forEach(m => {
        const div = document.createElement("div");
        // m.from はピア由来のときだけ入る発信元ルーム名
        const from = m.from ? `<span class="from">${esc(m.from)}</span>` : "";
        const remote = m.from ? " remote" : "";
        if (m.system) {
          div.className = `msg system${remote}`;
          div.innerHTML = `<span class="stamp">${esc(m.time)}</span>${from}${esc(m.text)}`;
        } else {
          div.className = `msg${remote}`;
          div.innerHTML = `<div class="meta">${from}<span>${esc(m.name)}</span> ${esc(m.time)}</div>`;
          const textEl = document.createElement("div");
          textEl.className = "text";
          const videoId = appendLinkedText(textEl, m.text);
          div.appendChild(textEl);
          if (videoId) div.appendChild(buildYouTubeEmbed(videoId));
        }
        messagesEl.appendChild(div);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // 1部屋ぶんの中身(キャラと名前バッジ)を描く。自分のルームにもピアのルームにも使う。
    // charaUrl はカスタム画像のURLを組み立てる関数(自分とピアで参照先が変わる)
    function renderRoomInto(tile, entries, charaUrl) {
      // ポーズ(0〜2)は入室時にサーバーが決めて退室まで固定。ピア由来の値は信用せず範囲に丸める
      const occupants = (entries || []).map(e => ({
        id: String(e.id ?? ""), room: e.room, name: String(e.name ?? ""), task: String(e.task ?? ""),
        pose: Math.min(2, Math.max(0, Math.trunc(e.pose) || 0)), imgv: e.imgv || 0,
      }));
      // 変化がなければDOMを触らない(作り直すとCSSアニメーションがリセットされるため)
      const state = JSON.stringify(occupants);
      if (state === tile.lastState) return;
      tile.lastState = state;
      tile.cells.forEach(cell => cell.innerHTML = "");
      occupants.forEach(o => {
        const cell = tile.cells[o.room - 1];
        if (!cell) return;
        const chara = document.createElement("div");
        chara.className = "chara";
        if (o.imgv) {
          // アップロードされたカスタム画像(imgvはキャッシュバスター兼差分検知用)
          chara.classList.add("custom");
          chara.style.backgroundImage = `url(${charaUrl(o)})`;
        } else {
          const col = ((o.room - 1) % 3) * 3 + o.pose;
          const row = Math.floor((o.room - 1) / 3) * 2;
          chara.style.backgroundPosition = `${col / 8 * 100}% ${row / 5 * 100}%`;
        }
        chara.style.animationDelay = `${(o.room * 0.3) % 2}s`;
        cell.appendChild(chara);
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = o.name;
        badge.title = o.task;
        cell.appendChild(badge);
      });
    }

    function selfCharaUrl(o) {
      return `/chara-custom/${encodeURIComponent(o.id)}.png?v=${o.imgv}`;
    }

    function peerCharaUrl(peerId) {
      return o => `/peer-chara/${encodeURIComponent(peerId)}/${encodeURIComponent(o.id)}.png?v=${o.imgv}`;
    }

    // ピアをマスに割り当てる。slotが重複・欠損していても(設定を手で編集した場合など)
    // 空いているマスに寄せて必ずどこかに出す
    function assignTiles() {
      const assigned = new Array(9).fill(null);
      assigned[SELF_INDEX] = { self: true };
      const overflow = [];
      peers.forEach(p => {
        const idx = SLOT_TO_INDEX[p.slot];
        if (idx !== undefined && !assigned[idx]) assigned[idx] = { peer: p };
        else overflow.push(p);
      });
      overflow.forEach(p => {
        const idx = assigned.findIndex(a => !a);
        if (idx >= 0) assigned[idx] = { peer: p };
      });
      return assigned;
    }

    function setClass(el, cls) {
      if (el.className !== cls) el.className = cls;
    }

    // サーバーが相手の部屋画像をまだ中継できない間はsrcを付けない。
    // ここで404を踏ませると、あとで取得できてもURLが変わらず再読み込みが走らないため、
    // 画像が出ないまま(キャラだけが浮いた状態)になってしまう
    function setPeerTileImage(tile, p) {
      if (!p.hasImage) {
        if (tile.img.getAttribute("src")) tile.img.removeAttribute("src");
        tile.img.classList.add("missing");
        return;
      }
      const src = `/peer-room-image/${encodeURIComponent(p.id)}.webp?v=${p.roomImageVersion || 0}`;
      if (tile.img.getAttribute("src") !== src) tile.img.src = src;
    }

    const PEER_STATUS = { false: "接続できません", null: "接続中…", undefined: "接続中…" };

    function renderWorld() {
      // ピアが1つも無いときはマップにせず、今までどおり自分のルームを全画面で出す
      const focus = peers.length === 0 ? "self" : focusedKey;
      worldMapEl.classList.toggle("focus-mode", focus !== null);
      assignTiles().forEach((slot, i) => {
        const tile = tiles[i];
        if (!slot) {
          // 接続を解除した直後は「接続できません」が残っているので消しておく
          if (tile.key !== null) { tile.key = null; tile.lastState = ""; tile.status.hidden = true; }
          setClass(tile.el, "tile empty");
          return;
        }
        const key = slot.self ? "self" : slot.peer.id;
        if (tile.key !== key) { tile.key = key; tile.lastState = ""; }
        const focused = focus === key ? " focused" : "";
        if (slot.self) {
          if (tile.img.getAttribute("src") !== selfRoomImageSrc) tile.img.src = selfRoomImageSrc;
          setClass(tile.el, `tile self${focused}`);
          tile.label.textContent = "このルーム";
          tile.status.hidden = true;
          renderRoomInto(tile, lastEntries, selfCharaUrl);
        } else {
          const p = slot.peer;
          setPeerTileImage(tile, p);
          setClass(tile.el, `tile peer${p.ok === false ? " offline" : ""}${focused}`);
          tile.label.textContent = p.ok === true ? `${p.name} (${(p.board || []).length}人)` : p.name;
          tile.status.hidden = p.ok === true;
          tile.status.textContent = PEER_STATUS[p.ok] || "";
          renderRoomInto(tile, p.board, peerCharaUrl(p.id));
        }
      });
      roomViewEl.classList.toggle("showing-self", focus === "self");
      backToMapBtn.hidden = !(peers.length > 0 && focusedKey !== null);
    }

    function renderBoard(entries) {
      lastEntries = entries;
      renderWorld();
      updateMyStatus();
      // 自分のルームの行に、つながった相手ルームの行を続ける
      const rows = [
        ...entries.map(e => ({ e, room: `Room ${e.room}`, local: true })),
        ...peers.flatMap(p => (p.board || []).map(e => ({ e, room: `${p.name} #${e.room}`, local: false }))),
      ];
      if (rows.length === 0) {
        entriesEl.innerHTML = `<div class="empty">まだ誰ももくもくしていません</div>`;
        return;
      }
      entriesEl.innerHTML = "";
      rows.forEach(({ e, room, local }) => {
        const div = document.createElement("div");
        div.className = local ? "entry" : "entry remote";
        const when = `${esc(e.start)}〜${esc(e.end || "?")}`;
        div.innerHTML = `<span class="room">${esc(room)}</span><span class="who">${esc(e.name)}</span><span class="when">${when}</span><span class="what">${esc(e.task)}</span>`;
        // 相手サーバーの参加者は操作できないので強制退出ボタンは出さない
        if (local && isAdmin && e.id !== clientId) {
          const kickBtn = document.createElement("button");
          kickBtn.type = "button";
          kickBtn.className = "kick";
          kickBtn.textContent = "強制退出";
          kickBtn.addEventListener("click", () => kickUser(e.id, e.name));
          div.appendChild(kickBtn);
        }
        entriesEl.appendChild(div);
      });
    }

    // 自分のチャットとピアのチャットを1本の時系列にまとめる
    function mergedMessages() {
      const all = localMessages.map(m => ({ ...m, ts: msgTs(m), from: null }));
      peers.forEach(p => (p.messages || []).forEach(m => all.push({ ...m, ts: msgTs(m), from: p.name })));
      return all.sort((a, b) => a.ts - b.ts);
    }

    // tsを持たない旧版のピア向けフォールバック。timeのHH:MMを今日の時刻として解釈する
    function msgTs(m) {
      if (typeof m.ts === "number") return m.ts;
      const hhmm = String(m.time || "").match(/(\d{1,2}):(\d{2})/);
      if (!hhmm) return 0;
      const d = new Date();
      d.setHours(+hhmm[1], +hhmm[2], 0, 0);
      return d.getTime() / 1000;
    }

    worldMapEl.addEventListener("click", e => {
      if (peers.length === 0) return; // ピアなしのときは常に自分のルームの全画面
      const tile = tiles.find(t => t.el === e.target.closest(".tile"));
      if (!tile || !tile.key || focusedKey === tile.key) return;
      focusedKey = tile.key;
      renderWorld();
    });

    backToMapBtn.addEventListener("click", () => {
      focusedKey = null;
      renderWorld();
    });

    // 入室状態に応じてフォームを切替:
    //   入室前     → 入室フォームのみ(チャット不可)
    //   入室中     → ステータス+編集/送信/退室ボタン+チャット
    //   編集モード → 入室フォーム(ボタンは「更新」)。チャットは編集を終えるまで不可
    function updateMyStatus() {
      const mine = lastEntries.find(e => e.id === clientId);
      if (mine) {
        const until = mine.end ? `〜${mine.end}` : "〜";
        myStatusEl.textContent = `🟢 ${mine.name}: ルーム${mine.room}でもくもく中(${mine.start}${until}): ${mine.task}`;
        joinRow.style.display = editing ? "flex" : "none";
        statusRow.style.display = editing ? "none" : "flex";
        joinBtn.textContent = "更新";
        cancelEditBtn.style.display = editing ? "inline-block" : "none";
      } else {
        editing = false;
        joinRow.style.display = "flex";
        statusRow.style.display = "none";
        joinBtn.textContent = "入室";
        cancelEditBtn.style.display = "none";
      }
    }

    // 相手ルームから中継されてきた文字列も必ずここを通す。型が文字列とは限らないので String() で受ける
    function esc(s) {
      return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    // 本文中のURLをテキストノードと<a>要素に分けてelに追加する。innerHTML文字列に組み込むのではなく
    // DOM要素として組み立てるので、esc()を通さなくてもXSSの心配がない。
    // 戻り値: 本文中で最初に見つかったYouTube動画ID(埋め込み用)。無ければnull
    function appendLinkedText(el, text) {
      // 日本語の文中にスペース無しで続く場合に備え、CJK文字・全角記号・閉じ括弧はURLに含めない
      // (生のURLにこれらの文字が現れることは実質無いため、境界として扱って安全)
      const URL_RE = /https?:\/\/[^\s)\]}\u3000-\u303f\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uff00-\uffef]+/g;
      let lastIndex = 0, match, videoId = null;
      while ((match = URL_RE.exec(text))) {
        if (match.index > lastIndex) el.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
        // 文末の句読点・閉じ括弧はURLに含めない(「〜です(https://...)。」のような文脈への対応)
        let url = match[0];
        const trail = url.match(/[)\]}.,!?、。」』]+$/);
        if (trail) url = url.slice(0, -trail[0].length);
        const a = document.createElement("a");
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = url;
        el.appendChild(a);
        if (trail) el.appendChild(document.createTextNode(trail[0]));
        if (!videoId) videoId = extractYouTubeId(url);
        lastIndex = match.index + match[0].length;
      }
      if (lastIndex < text.length) el.appendChild(document.createTextNode(text.slice(lastIndex)));
      return videoId;
    }

    // YouTubeの各種URL形式(watch?v=, youtu.be/, shorts/, embed/)から11文字の動画IDを取り出す。
    // 該当しなければnull(埋め込みなし、リンクだけになる)
    function extractYouTubeId(url) {
      let u;
      try { u = new URL(url); } catch { return null; }
      const host = u.hostname.replace(/^(www\.|m\.)/, "");
      const idOk = id => /^[\w-]{11}$/.test(id) ? id : null;
      if (host === "youtu.be") return idOk(u.pathname.slice(1));
      if (host === "youtube.com" || host === "youtube-nocookie.com") {
        if (u.pathname === "/watch") return idOk(u.searchParams.get("v") || "");
        const m = u.pathname.match(/^\/(?:shorts|embed)\/([\w-]{11})/);
        if (m) return idOk(m[1]);
      }
      return null;
    }

    // youtube-nocookie.comを使うのは、埋め込み再生に伴うトラッキング/Cookieを減らすため
    function buildYouTubeEmbed(id) {
      const wrap = document.createElement("div");
      wrap.className = "yt-embed";
      const iframe = document.createElement("iframe");
      iframe.src = `https://www.youtube-nocookie.com/embed/${id}`;
      iframe.loading = "lazy";
      iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      iframe.allowFullscreen = true;
      iframe.referrerPolicy = "strict-origin-when-cross-origin";
      wrap.appendChild(iframe);
      return wrap;
    }

    function nowHHMM() {
      return new Date().toTimeString().slice(0, 5);
    }

    // 選択された画像を最大256pxに縮小してPNGのデータURLにする(画像でないファイルはthrow)
    async function fileToDataUrl(file) {
      const bmp = await createImageBitmap(file);
      const MAX = 256;
      const scale = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(bmp.width * scale));
      canvas.height = Math.max(1, Math.round(bmp.height * scale));
      canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/png");
    }

    // 書き込み系APIの共通処理。サーバーがvery easyモードのときは401が返るので、
    // そこで初めて合言葉を聞いてlocalStorageに保存し再送する(noneモードでは一切聞かない)。
    // キャンセルまたは規定回数失敗ならnullを返す(呼び出し元は中断する)
    async function postJson(url, body) {
      for (let attempt = 0; attempt < 3; attempt++) {
        const passphrase = localStorage.getItem("mokumoku-passphrase") || "";
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(passphrase ? { ...body, passphrase } : body),
        });
        if (res.status !== 401) return res.json();
        localStorage.removeItem("mokumoku-passphrase");
        const input = (prompt(passphrase ? "合言葉が違います。もう一度入力してください" : "合言葉を入力してください") || "").trim();
        if (!input) return null;
        localStorage.setItem("mokumoku-passphrase", input);
      }
      localStorage.removeItem("mokumoku-passphrase");
      alert("合言葉が違います");
      return null;
    }

    const DISCORD_BADGES = {
      on:    { label: "Discord投稿: オン", title: "チャットと入退室はDiscordにも投稿されます" },
      off:   { label: "Discord投稿: オフ", title: "Discordには投稿されません(Webhook URL未設定)" },
      error: { label: "Discord投稿: エラー", title: "直近のDiscord投稿に失敗しました(Webhook URLが失効している可能性)" },
    };

    function renderStatus(status) {
      const badge = DISCORD_BADGES[status.discord];
      if (badge) {
        discordStatusEl.textContent = badge.label;
        discordStatusEl.title = badge.title;
        discordStatusEl.className = status.discord;
      }
      if (typeof status.roomImageVersion === "number") {
        scheduleRoomImageRefresh(status.roomImageVersion);
      }
    }

    // 部屋画像が変わったことをpoll(2秒間隔)で検知したら、全員が同時に1〜2MBの画像を
    // 再取得してアクセスが集中しないよう、0〜8秒のランダムな待ち時間を挟んでから反映する
    // (poll間隔とジッターの合計で、最悪でも10秒程度以内には全員に反映される想定)
    function scheduleRoomImageRefresh(version) {
      if (roomImageVersion === null) {
        // 初回pollでは「今表示中の画像がこのバージョン」という基準値を記録するだけ(再取得はしない)
        roomImageVersion = version;
        return;
      }
      if (version === roomImageVersion || version === pendingImageVersion) return;
      pendingImageVersion = version;
      const delay = Math.random() * 8000;
      setTimeout(() => {
        roomImageVersion = version;
        pendingImageVersion = null;
        selfRoomImageSrc = `/room-image.webp?v=${version}`;
        renderWorld();
      }, delay);
    }

    // 今保持している合言葉が管理者合言葉かどうかをサーバーに確認する(ボタン表示の判定用)
    async function checkAdmin() {
      const passphrase = localStorage.getItem("mokumoku-passphrase") || "";
      if (!passphrase) {
        isAdmin = false;
      } else {
        try {
          const res = await fetch("/admin/status", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ passphrase }),
          });
          const data = await res.json();
          isAdmin = !!data.isAdmin;
        } catch {
          isAdmin = false;
        }
      }
      syncAdminButtons();
    }

    async function kickUser(id, name) {
      if (!confirm(`${name} を強制退出させますか？`)) return;
      const passphrase = localStorage.getItem("mokumoku-passphrase") || "";
      try {
        const res = await fetch("/board/kick", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, passphrase }),
        });
        if (!res.ok) { alert("強制退出に失敗しました"); return; }
      } catch {
        alert("強制退出に失敗しました");
        return;
      }
      await poll();
    }

    // isAdminが変化した瞬間だけボタン(と開いていればパネル)を除去/追加する。
    // renderBoardのkickボタンと違い、2秒ごとのpollで作り直すとパネルの開閉状態が消えてしまうため、
    // 「変化があったときだけ」DOMを触る設計にする
    function syncAdminButtons() {
      if (isAdmin === prevIsAdmin) return;
      prevIsAdmin = isAdmin;
      const existingBar = document.getElementById("adminBar");
      if (isAdmin && !existingBar) {
        const bar = document.createElement("div");
        bar.id = "adminBar";
        bar.append(
          adminButton("roomImageBtn", "部屋画像を変更", toggleRoomImagePanel),
          adminButton("worldBtn", "ワールド設定", toggleWorldPanel),
        );
        roomViewEl.appendChild(bar);
      } else if (!isAdmin) {
        existingBar?.remove();
        document.getElementById("roomImagePanel")?.remove();
        document.getElementById("worldPanel")?.remove();
      }
    }

    function adminButton(id, label, onClick) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.id = id;
      btn.textContent = label;
      btn.addEventListener("click", onClick);
      return btn;
    }

    async function toggleRoomImagePanel() {
      const existingPanel = document.getElementById("roomImagePanel");
      if (existingPanel) { existingPanel.remove(); return; }
      const passphrase = localStorage.getItem("mokumoku-passphrase") || "";
      let data;
      try {
        const res = await fetch("/admin/room-images", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ passphrase }),
        });
        if (!res.ok) { alert("画像一覧の取得に失敗しました"); return; }
        data = await res.json();
      } catch {
        alert("画像一覧の取得に失敗しました");
        return;
      }
      const panel = document.createElement("div");
      panel.id = "roomImagePanel";
      (data.images || []).forEach(name => {
        const img = document.createElement("img");
        img.src = `/room-image-preview/${encodeURIComponent(name)}`;
        img.alt = name;
        img.title = name;
        if (name === data.current) img.classList.add("selected");
        img.addEventListener("click", () => applyRoomImage(name));
        panel.appendChild(img);
      });
      roomViewEl.appendChild(panel);
    }

    async function applyRoomImage(name) {
      const passphrase = localStorage.getItem("mokumoku-passphrase") || "";
      let data;
      try {
        const res = await fetch("/admin/room-image", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ passphrase, file: name }),
        });
        if (!res.ok) { alert("部屋画像の変更に失敗しました"); return; }
        data = await res.json();
      } catch {
        alert("部屋画像の変更に失敗しました");
        return;
      }
      document.getElementById("roomImagePanel")?.remove();
      // 操作した本人はジッター待ちせず即時反映。以後のpollで同じバージョンを受け取っても
      // scheduleRoomImageRefreshが「既に反映済み」と判定して再取得しないよう基準値も更新する
      roomImageVersion = data.version;
      pendingImageVersion = null;
      selfRoomImageSrc = `/room-image.webp?v=${data.version}`;
      renderWorld();
    }

    const PEER_ERRORS = {
      "invalid url": "URLの形式が正しくありません(https://ホスト名 の形で入力してください)",
      "already connected": "そのルームとは既につながっています",
      "peer limit reached": "つなげるルームは8つまでです",
      "admin required": "管理者合言葉が必要です",
    };

    async function toggleWorldPanel() {
      const existing = document.getElementById("worldPanel");
      if (existing) { existing.remove(); return; }
      const passphrase = localStorage.getItem("mokumoku-passphrase") || "";
      let data;
      try {
        const res = await fetch("/admin/peers", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ passphrase }),
        });
        if (!res.ok) { alert("ワールド設定の取得に失敗しました"); return; }
        data = await res.json();
      } catch {
        alert("ワールド設定の取得に失敗しました");
        return;
      }
      const panel = document.createElement("div");
      panel.id = "worldPanel";
      const list = data.peers || [];
      if (list.length === 0) {
        const empty = document.createElement("div");
        empty.className = "peer-empty";
        empty.textContent = "まだどのルームともつながっていません";
        panel.appendChild(empty);
      }
      list.forEach(p => {
        const row = document.createElement("div");
        row.className = "peer-row";
        const info = document.createElement("span");
        info.className = "peer-info";
        info.textContent = p.name;
        info.title = p.url;
        const del = document.createElement("button");
        del.type = "button";
        del.className = "peer-del";
        del.textContent = "解除";
        del.addEventListener("click", () => changePeer({ action: "remove", id: p.id }));
        row.append(info, del);
        panel.appendChild(row);
      });
      const urlInput = document.createElement("input");
      urlInput.type = "text";
      urlInput.placeholder = "相手ルームのURL (https://...)";
      const nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.placeholder = "表示名 (任意)";
      const submit = () => changePeer({ action: "add", url: urlInput.value.trim(), name: nameInput.value.trim() });
      [urlInput, nameInput].forEach(el => el.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); submit(); }
      }));
      const addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.textContent = "つなぐ";
      addBtn.addEventListener("click", submit);
      const add = document.createElement("div");
      add.className = "peer-add";
      add.append(urlInput, nameInput, addBtn);
      panel.appendChild(add);
      roomViewEl.appendChild(panel);
    }

    async function changePeer(body) {
      if (body.action === "add" && !body.url) { alert("相手ルームのURLを入力してください"); return; }
      if (body.action === "remove" && !confirm("この接続を解除しますか？")) return;
      const passphrase = localStorage.getItem("mokumoku-passphrase") || "";
      try {
        const res = await fetch("/admin/peer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...body, passphrase }),
        });
        const data = await res.json();
        if (!res.ok) { alert(PEER_ERRORS[data.error] || "操作に失敗しました"); return; }
      } catch {
        alert("操作に失敗しました");
        return;
      }
      document.getElementById("worldPanel")?.remove();
      await poll();
      toggleWorldPanel(); // 更新後の一覧を出し直す
    }

    async function poll() {
      try {
        const [msgRes, boardRes, statusRes, worldRes] = await Promise.all([
          fetch("/messages"), fetch("/board"), fetch("/status"), fetch("/world"),
        ]);
        await checkAdmin();
        localMessages = await msgRes.json();
        const world = await worldRes.json();
        peers = Array.isArray(world.peers) ? world.peers : [];
        // 拡大表示中のピアが解除されたらマップ表示に戻す
        if (focusedKey && focusedKey !== "self" && !peers.some(p => p.id === focusedKey)) focusedKey = null;
        renderBoard(await boardRes.json());
        renderStatus(await statusRes.json());
        render(mergedMessages());
      } catch {}
    }

    taskEl.addEventListener("input", () => {
      if (taskEl.value && !startEl.value) startEl.value = nowHHMM();
    });

    // Enterで送信、Shift+Enterで改行(IME変換確定のEnterでは送信しない)
    textEl.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    // 入力に合わせて高さを自動調整
    textEl.addEventListener("input", () => {
      textEl.style.height = "auto";
      textEl.style.height = Math.min(textEl.scrollHeight, 120) + "px";
    });

    form.addEventListener("submit", async e => {
      e.preventDefault();
      const name = nameEl.value.trim();
      const text = textEl.value.trim();
      if (!name || !text) return;
      const result = await postJson("/messages", { name, text });
      if (!result) return;
      textEl.value = "";
      textEl.style.height = "auto";
      await poll();
    });

    joinBtn.addEventListener("click", async () => {
      const name = nameEl.value.trim();
      const task = taskEl.value.trim();
      if (!name) { alert("名前を入力してください"); nameEl.focus(); return; }
      if (!task) { alert("もくもくする内容を入力してください"); taskEl.focus(); return; }
      let image = null;
      if (charaEl.files[0]) {
        try {
          image = await fileToDataUrl(charaEl.files[0]);
        } catch {
          alert("画像として読み込めませんでした");
          charaEl.value = "";
          return;
        }
      }
      const result = await postJson("/board/join", { id: clientId, name, task, start: startEl.value, end: endEl.value, ...(image && { image }) });
      if (!result) return;
      if (result.roomFull) {
        alert("満室です。空きが出るまでお待ちください");
        return;
      }
      if (result.error) {
        alert("入室に失敗しました: " + result.error);
        return;
      }
      // 送信済みの画像はクリア(編集モードで再送しない=サーバー側で維持される)
      charaEl.value = "";
      recordRow.style.display = "none";
      const wasEditing = editing;
      editing = false;
      // 新規入室時は挨拶メッセージを規定値としてセット
      if (!wasEditing && !textEl.value) {
        textEl.value = `${task}でもくもくします`;
      }
      await poll();
      textEl.focus();
    });

    editBtn.addEventListener("click", () => {
      const mine = lastEntries.find(e => e.id === clientId);
      if (!mine) return;
      editing = true;
      nameEl.value = mine.name;
      taskEl.value = mine.task;
      startEl.value = mine.start;
      endEl.value = mine.end;
      updateMyStatus();
      taskEl.focus();
    });

    cancelEditBtn.addEventListener("click", () => {
      editing = false;
      charaEl.value = "";
      updateMyStatus();
    });

    // 入室フォームでEnterを押したら入室(IME変換確定は除く)
    [nameEl, taskEl].forEach(el => el.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.isComposing) {
        e.preventDefault();
        joinBtn.click();
      }
    }));

    leaveBtn.addEventListener("click", async () => {
      if (!confirm("退室しますか？")) return;
      const result = await postJson("/board/leave", { id: clientId });
      if (!result) return;
      // 退室したら合言葉を覚えたままにしない。次回入室時に必ず聞き直すことで、
      // 同じブラウザでも管理者合言葉に切り替えて入り直せるようにする
      localStorage.removeItem("mokumoku-passphrase");
      taskEl.value = "";
      startEl.value = "";
      endEl.value = "";
      if (result.record) {
        recordText.value = result.record;
        recordRow.style.display = "flex";
      }
      await poll();
    });

    copyBtn.addEventListener("click", async () => {
      recordText.select();
      let ok = false;
      // LAN経由のhttp(非セキュアコンテキスト)ではclipboard APIが使えないためexecCommandにフォールバック
      if (navigator.clipboard && window.isSecureContext) {
        try { await navigator.clipboard.writeText(recordText.value); ok = true; } catch {}
      }
      if (!ok) ok = document.execCommand("copy");
      copyBtn.textContent = ok ? "コピーしました" : "コピー失敗";
      setTimeout(() => { copyBtn.textContent = "コピー"; }, 1500);
    });

    closeRecordBtn.addEventListener("click", () => {
      recordRow.style.display = "none";
    });

    renderWorld(); // 初回pollを待たずに自分のルームを出す
    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
