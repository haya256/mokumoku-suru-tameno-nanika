<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>もくもく会</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="roomView">
    <div id="worldMap"></div>
    <button type="button" id="backToMapBtn" hidden>← マップへ</button>
    <!-- 再生中のマスは拡大表示のあいだ隠れる(音は鳴り続ける)ので、止める手綱をここに常設する -->
    <div id="nowPlayingBar" hidden>
      <span id="nowPlayingLabel"></span>
      <button type="button" id="nowPlayingGoBtn">そのマスへ</button>
      <button type="button" id="nowPlayingStopBtn" title="停止">⏹</button>
    </div>
    <!-- アバタークリックで出るステータスウィンドウ(閲覧専用・管理者権限不要)。
         #roomView(マップ側)の中央に出したいので、#roomView配下に置いてabsolute配置する -->
    <div id="charaStatusOverlay" hidden>
      <div id="charaStatusWindow" role="dialog" aria-modal="true" aria-labelledby="charaStatusName">
        <div id="charaStatusNamePlate"><span id="charaStatusName"></span></div>
        <div id="charaStatusBody">
          <div id="charaStatusPortrait"></div>
          <div id="charaStatusText"></div>
        </div>
        <button type="button" id="charaStatusCloseBtn">✕ とじる</button>
      </div>
    </div>
  </div>
  <div id="main">
  <header><span id="roomTitle">もくもく会</span> <span id="discordStatus"></span></header>
  <div id="board">
    <h2>もくもくフレンズ</h2>
    <div id="entries"><div class="empty">まだ誰ももくもくしていません</div></div>
  </div>
  <div id="messages"></div>
  <form id="form">
    <div class="row" id="viewOnlyRow">
      <span>👀 見る専モード</span>
      <button type="button" id="goReceptionBtn">受付にいく</button>
    </div>
    <div class="row" id="joinRow" style="display: none;">
      <div class="lines">
        <div class="row-line">
          <input id="name" type="text" placeholder="もくもくネーム" autocomplete="off" data-1p-ignore data-lpignore="true" data-bwignore>
          <span class="field"><label for="chara">キャラ画像(任意/未指定なら自動割当)</label><input id="chara" type="file" accept="image/*"></span>
        </div>
        <div class="row-line">
          <input id="task" type="text" placeholder="もくもくする内容(ボードに載ります)">
          <span class="field"><label for="start">開始</label><input id="start" type="time"></span>
          <span class="field"><label for="end">終了予定</label><input id="end" type="time"></span>
        </div>
      </div>
      <button type="button" id="joinBtn" class="tall-btn">入室</button>
      <button type="button" id="cancelEditBtn" class="tall-btn" style="display: none;">キャンセル</button>
    </div>
    <div class="row" id="statusRow" style="display: none;">
      <div class="lines">
        <div class="row-line">
          <span id="myStatus"></span>
          <button type="button" id="editBtn">編集</button>
        </div>
        <div class="row-line" id="pendingImageRow" style="display: none;">
          <img id="pendingImagePreview" alt="添付画像プレビュー">
          <button type="button" id="removePendingImageBtn">✕</button>
        </div>
        <div class="row-line">
          <input id="msgImage" type="file" accept="image/*" hidden>
          <button type="button" id="attachImageBtn" title="画像を添付">📷</button>
          <textarea id="text" placeholder="コメント (Shift+Enterで改行)" rows="1"></textarea>
          <button type="submit">送信</button>
        </div>
      </div>
      <button type="button" id="leaveBtn" class="tall-btn">退室</button>
    </div>
    <div class="row" id="recordRow" style="display: none;">
      <span id="recordLabel">📋 今日の記録</span>
      <input id="recordText" type="text" readonly>
      <button type="button" id="copyBtn">コピー</button>
      <button type="button" id="closeRecordBtn">✕</button>
    </div>
  </form>
  </div>

  <!-- 通常の<script>を順に読み込む(全ファイルで1つのグローバルスコープを共有する)。
       kinds/ の順番はマスの部品の重なり順とワールド設定パネルの選択肢の順になる。main.jsは必ず最後 -->
  <script src="/static/js/core.js"></script>
  <script src="/static/js/kinds.js"></script>
  <script src="/static/js/kinds/peer.js"></script>
  <script src="/static/js/kinds/youtube.js"></script>
  <script src="/static/js/kinds/clock.js"></script>
  <script src="/static/js/kinds/calendar.js"></script>
  <script src="/static/js/kinds/browser.js"></script>
  <script src="/static/js/kinds/basic.js"></script>
  <script src="/static/js/world.js"></script>
  <script src="/static/js/playback.js"></script>
  <script src="/static/js/chat.js"></script>
  <script src="/static/js/board.js"></script>
  <script src="/static/js/admin.js"></script>
  <script src="/static/js/main.js"></script>
</body>
</html>
